<h3>Description</h3>

<p>Returns a function that takes an 8-element parameter vector (C++ layout)
and returns <code>log(P_tree(pars))</code>, the log-probability that both basal
lineages survive to the present.
</p>

<h3>Usage</h3>

<pre><code class='language-R'>.build_cond_fun(gam_fit, model_bin)
</code></pre>
