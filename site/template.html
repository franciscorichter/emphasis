<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · emphasis</title>
<meta name="description" content="{{description}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Source+Sans+3:wght@400;600&family=Source+Code+Pro:wght@400;600&display=swap">
<link rel="stylesheet" href="{{root}}assets/site.css">
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]'], ['$$', '$$']],
    tags: 'ams',
    processEscapes: true
  },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'], processHtmlClass: 'reqn' },
  output: { linebreaks: { inline: true, width: '100%' } },
  svg: { fontCache: 'global' }
};
</script>
<script defer src="{{root}}assets/mathjax/tex-svg.js"></script>
</head>
<body>
<header class="site-header">
<nav class="site-nav" aria-label="Site">
<a class="brand" href="{{root}}index.html">emphasis</a>
<ul>
{{nav}}
</ul>
</nav>
</header>
<main>
<article class="{{article_class}}">
<header class="page-header">
<h1>{{h1}}</h1>
</header>
{{toc}}
{{body}}
</article>
</main>
<footer class="site-footer">
<p>emphasis, {{version}}. Francisco Richter, Università della Svizzera italiana.</p>
</footer>
</body>
</html>
